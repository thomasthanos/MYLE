# Checks every push to main and every pull request: the download site, the
# frontend, the Rust backend and the setup (clippy and the unit tests), and
# builds the setup and installs, updates and uninstalls it. Everything is
# Windows-only, so it all runs on Windows. Releases stay in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - run: npm ci

      - run: npm run check

      # tauri::generate_context! embeds the built frontends (backend/target/web/
      # for the app, backend/target/web-setup/ for the setup, web-mobile/ for
      # MYLE Passwords, whose phone builds are mobile.yml's).
      - run: node scripts/prepare-extension.mjs && npx vite build

      - run: npx vite build --mode setup

      - run: npx vite build --mode mobile

      # The bundle lists the pinned Ludusavi files, and the build checks
      # that they exist; they are downloaded and verified, never committed.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/bootstrap-game-saves.ps1

      - name: Clippy
        working-directory: backend
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: backend
        run: cargo test --locked --workspace

      - name: Script tests
        run: node --test "scripts/tests/*.test.mjs"

  setup:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          key: release

      - run: npm ci

      - name: Build the setup (unsigned)
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install, update and uninstall it
        shell: pwsh
        run: |
          $setup = Get-ChildItem "backend/target/release/bundle/setup/MYLE.exe" | Select-Object -First 1
          if (-not $setup) { throw "The setup was not produced." }
          ./scripts/smoke-test-setup.ps1 -Setup $setup.FullName

      - name: Keep the setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup-${{ github.sha }}
          path: backend/target/release/bundle/setup/MYLE.exe
          retention-days: 7

  # MYLE Passwords' Android-only code (the Keystore, the update installer)
  # compiles only for Android: checked here, not first at release time.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          key: android-check

      - run: npm ci

      - run: npx vite build --mode mobile

      - name: Check MYLE Passwords for Android
        working-directory: backend
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo check --locked -p myle-passwords --target aarch64-linux-android --lib

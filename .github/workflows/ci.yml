# Checks every push to main and every pull request: the download site, the
# frontend, the Rust backend and the setup (clippy and the unit tests), and
# builds the setup and installs, updates and uninstalls it. Everything is
# Windows-only, so it all runs on Windows. Releases stay in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - run: npm ci

      - run: npm run check

      # tauri::generate_context! embeds the built frontends (backend/target/web/
      # for the app, backend/target/web-setup/ for the setup, web-mobile/ for
      # MYLE Passwords, whose phone builds are mobile.yml's).
      - run: node scripts/prepare-extension.mjs && npx vite build

      - run: npx vite build --mode setup

      - run: npx vite build --mode mobile

      # The bundle lists the pinned Ludusavi files, and the build checks
      # that they exist; they are downloaded and verified, never committed.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/bootstrap-game-saves.ps1

      - name: Clippy
        working-directory: backend
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: backend
        run: cargo test --locked --workspace

      - name: Script tests
        run: node --test "scripts/tests/*.test.mjs"

  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: release

      - run: npm ci

      - name: Build the setup (unsigned)
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install, update and uninstall it
        shell: pwsh
        run: |
          $setup = Get-ChildItem "backend/target/release/bundle/setup/MYLE.exe" | Select-Object -First 1
          if (-not $setup) { throw "The setup was not produced." }
          ./scripts/smoke-test-setup.ps1 -Setup $setup.FullName

      - name: Keep the setup
        uses: actions/upload-artifact@v4
        with:
          name: setup-${{ github.sha }}
          path: backend/target/release/bundle/setup/MYLE.exe
          retention-days: 7

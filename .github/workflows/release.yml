# Builds, signs and publishes a release of the Windows app.
#
# Release: bump "version" in package.json and backend/Cargo.toml, and MYLE
# Passwords' in backend/mobile/tauri.conf.json and backend/mobile/Cargo.toml,
# commit, then push a matching tag:   git tag v7.0.2 && git push origin main v7.0.2
# This workflow builds the Windows app and mobile.yml the phone apps, into
# one GitHub release.
#
# Where updates come from (backend/src/updater.rs):
#   1. latest.json on Cloudflare R2 (downloads.thomast.uk), uploaded here
#   2. the GitHub release, as a fallback while R2 is unreachable
# Both carry the SHA-256 the app checks before it runs the installer.
#
# Run by hand (Actions > Release > Run workflow) for a dry run: the same
# build and signature, with the installer kept as a workflow artifact and
# nothing uploaded or published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One Windows release at a time, whatever the tag: two tags pushed close
# together (or a re-run of an old one) must not race to write latest.json.
# A newer tag waits for the one in progress; the publish step also refuses
# to put an older version over a newer one.
concurrency:
  group: release-windows
  cancel-in-progress: false

env:
  # Optional sign-in start page (docs/auth-worker.js); empty uses Supabase.
  MYLE_AUTH_URL: ${{ vars.MYLE_AUTH_URL }}

jobs:
  windows:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WIN_CSC_LINK != '' }}
    steps:
      # No token left in .git/config for the build's tools to read: the one
      # step that needs it (gh release) is handed it explicitly.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Read the app version and update feed
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path backend/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($cargo -ne $version) {
            throw "package.json is $version but backend/Cargo.toml is $cargo"
          }
          if ("${{ github.ref_type }}" -eq "tag" -and "v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match the app version $version"
          }
          # The app's own feed address, so the upload can never drift from it.
          $feed = (Select-String -Path backend/src/updater.rs -Pattern 'UPDATE_FEED: &str = "([^"]+)"').Matches[0].Groups[1].Value
          $base = $feed.Substring(0, $feed.LastIndexOf('/'))
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FEED_URL=$feed"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FEED_BASE=$base"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Explicit per-release opt-out; normal releases retain their checks.
          $skipChecks = $false
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagNotes = @(git for-each-ref '--format=%(contents)' "refs/tags/${{ github.ref_name }}")
            $skipChecks = $tagNotes -contains "Checks: skip"
          }
          "SKIP_CHECKS=$($skipChecks.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: npm ci

      - run: npm run check
        if: env.SKIP_CHECKS != 'true'

      # Installed copies only take an update signed with the release
      # certificate (backend/src/updater.rs, RELEASE_SIGNERS): an unsigned
      # one would be refused by every PC, so it is never published.
      - name: Refuse an unsigned release
        if: github.ref_type == 'tag' && env.HAS_CERT != 'true'
        shell: pwsh
        run: |
          Write-Host "::error::WIN_CSC_LINK is not set: a release must be signed."
          exit 1

      # The build runs with no certificate in its environment: npm packages,
      # build scripts and the compiler never see it. Signing happens in steps
      # of their own, which hold the secret only while they run
      # (scripts/sign.ps1 writes it to a temporary file and deletes it).
      #
      # 1. The app and its uninstaller. Also downloads and verifies the pinned
      # Ludusavi runtime for Game Saves (scripts/bootstrap-game-saves.ps1).
      - name: Build the app and the uninstaller
        shell: pwsh
        run: |
          if ($env:HAS_CERT -ne 'true') {
            Write-Host "::warning::WIN_CSC_LINK is not set: building an unsigned setup (dry run only)."
          }
          # Windows PowerShell, as `npm run build` runs it.
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-setup.ps1 -Phase binaries

      - name: Sign the app and the uninstaller
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WIN_CSC_LINK }}
          CERT_PASS: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: ./scripts/sign.ps1 -Path backend/target/release/MYLE.exe, backend/target/release/uninstall.exe

      # 2. The setup that carries both (backend/installer).
      - name: Build the setup
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-setup.ps1 -Phase setup

      - name: Sign the setup
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WIN_CSC_LINK }}
          CERT_PASS: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: ./scripts/sign.ps1 -Path backend/target/release/bundle/setup/MYLE.exe

      - name: Collect the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "backend/target/release/bundle/setup/MYLE.exe" | Select-Object -First 1
          if (-not $setup) { throw "The setup was not produced." }
          # The app version is in the release tag and latest.json, not the filename.
          $name = "MYLE.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $setup.FullName "out/$name"
          # Store-ready extension packages, prepared by the build script.
          foreach ($browser in @("chrome", "firefox")) {
            $extension = Get-Item "extension/myle-passwords-$browser.zip" -ErrorAction Stop
            Copy-Item $extension.FullName "out/$($extension.Name)"
          }
          if ($env:HAS_CERT -eq 'true') {
            # The certificates installed copies accept (updater.rs, RELEASE_SIGNERS).
            $pinned = [regex]::Matches((Get-Content backend/src/updater.rs -Raw), 'RELEASE_SIGNERS: &\[&str\] = &\[([^\]]*)\]')[0].Groups[1].Value
            $accepted = [regex]::Matches($pinned, '"([0-9A-Fa-f]{40})"') | ForEach-Object { $_.Groups[1].Value.ToUpperInvariant() }
            if (-not $accepted) { throw "RELEASE_SIGNERS was not found in backend/src/updater.rs" }
            # The app and uninstaller inside the payload were signed before
            # packing; the setup itself is checked here. MYLE's certificate is
            # its own, so Windows reports UnknownError (an untrusted root) for
            # an intact signature: what matters is the hash and the signer.
            $signature = Get-AuthenticodeSignature "out/$name"
            Write-Host "Signature: $($signature.Status) $($signature.SignerCertificate.Subject) $($signature.SignerCertificate.Thumbprint)"
            if ($signature.Status -notin @('Valid', 'UnknownError')) {
              throw "The installer's signature is $($signature.Status)."
            }
            if ($signature.SignerCertificate.Thumbprint -notin $accepted) {
              throw "The installer is signed with $($signature.SignerCertificate.Thumbprint), which installed copies do not accept (updater.rs RELEASE_SIGNERS)."
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "The installer's signature has no timestamp."
            }
          }
          "SETUP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Keep the installer (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: MYLE
          path: out/*
          retention-days: 7

      - name: Publish to Cloudflare R2
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $setup = Get-Item "out/$env:SETUP_NAME"
          $sha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          function Publish([string]$File, [string]$Key, [string[]]$Extra = @()) {
            aws s3 cp $File "s3://$env:R2_BUCKET/$Key" --endpoint-url $endpoint @Extra
            if ($LASTEXITCODE -ne 0) { throw "Upload failed: $Key" }
          }
          function Assert-Served([string]$Key, [string]$Expected) {
            $served = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($Key))
            Invoke-WebRequest -Uri "$env:FEED_BASE/$Key" -OutFile $served -Headers @{ 'Cache-Control' = 'no-cache' }
            $actual = (Get-FileHash $served -Algorithm SHA256).Hash.ToLowerInvariant()
            Remove-Item $served
            if ($actual -ne $Expected) { throw "$Key served by $env:FEED_BASE does not match the build" }
            Write-Host "Verified $env:FEED_BASE/$Key"
          }

          # Never an older version over a newer one (a re-run of an old tag,
          # or two tags close together).
          $live = try { Invoke-RestMethod -Uri $env:FEED_URL -Headers @{ 'Cache-Control' = 'no-cache' } } catch { $null }
          if ($live -and $live.version) {
            try { $newer = [semver]"$($live.version)" -gt [semver]$env:VERSION } catch { $newer = $false; Write-Host "::warning::Could not compare the live version $($live.version)" }
            if ($newer) { throw "$env:FEED_BASE already serves $($live.version), newer than $env:VERSION: nothing was published." }
          }

          $exe = @('--content-type', 'application/vnd.microsoft.portable-executable', '--cache-control', 'no-cache')
          # The feed names this version's own file: no cache, and no upload
          # in progress, can hand a client an exe that does not match the
          # feed's hash.
          $versioned = "MYLE-$env:VERSION.exe"
          Publish $setup.FullName $versioned $exe
          Assert-Served $versioned $sha256
          Publish $setup.FullName "MYLE.exe" $exe
          Assert-Served "MYLE.exe" $sha256
          # The site and README link to MYLE.exe; the old name stays for links
          # already shared (and older copies of the pages).
          Publish $setup.FullName "MakeYourLifeEasier-installer.exe" $exe

          # The feed goes last: clients only see a version once MYLE.exe is live.
          $feed = [ordered]@{
            version   = $env:VERSION
            notes     = "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            pubDate   = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            installer = [ordered]@{
              name   = $setup.Name
              url    = "$env:FEED_BASE/$versioned"
              size   = $setup.Length
              sha256 = $sha256
            }
          }
          $feedFile = Join-Path $env:RUNNER_TEMP "latest.json"
          $feed | ConvertTo-Json -Depth 4 | Set-Content -Path $feedFile -Encoding utf8NoBOM
          Publish $feedFile "latest.json" @('--content-type', 'application/json', '--cache-control', 'no-cache')
          Assert-Served "latest.json" (Get-FileHash $feedFile -Algorithm SHA256).Hash.ToLowerInvariant()

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hand-written notes when docs/release-notes/<version>.md exists,
          # GitHub's generated list of changes otherwise.
          $notes = "docs/release-notes/${env:VERSION}.md"
          $body = if (Test-Path $notes) { @("--notes-file", $notes) } else { @("--generate-notes") }
          # One release for everything: mobile.yml builds MYLE Passwords for
          # the same tag and adds its APK and IPA here, whichever finishes first
          # makes the release.
          $tag = "${{ github.ref_name }}"
          $files = (Get-ChildItem out).FullName
          $created = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $files --title "MYLE $tag" @body --latest
            $created = $LASTEXITCODE -eq 0
          }
          if (-not $created) {
            gh release upload $tag $files --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # The Windows app's release is GitHub's "latest" (the app's own
          # fallback when R2 is unreachable reads the releases).
          $edit = if (Test-Path $notes) { @("--notes-file", $notes) } else { @() }
          gh release edit $tag --title "MYLE $tag" @edit --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

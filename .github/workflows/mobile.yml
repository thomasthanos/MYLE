# Builds MYLE Passwords, the Password Manager for phones (backend/mobile): an
# APK for Android, signed with the project's key, and an unsigned IPA for
# iPhones, which SideStore signs with the user's own Apple ID.
#
# Release: bump "version" in backend/mobile/tauri.conf.json and
# backend/mobile/Cargo.toml, commit, then push a matching tag:
#   git tag mobile-v1.0.1 && git push origin main mobile-v1.0.1
# It publishes to Cloudflare R2 (downloads.thomast.uk) MYLE-Passwords.apk,
# MYLE-Passwords.ipa, sidestore.json (the SideStore source) and, last,
# mobile-latest.json (Android's update check), and a GitHub release.
#
# Run by hand (Actions > MYLE Passwords > Run workflow), or push a branch
# named mobile/..., for a dry run: the same builds, kept as artifacts.
#
# The Android key: GitHub secrets ANDROID_KEYSTORE_B64 (the PKCS12 file,
# base64) and ANDROID_KEYSTORE_PASSWORD, alias "myle". Losing it means
# installed copies can never be updated.
name: MYLE Passwords

on:
  push:
    tags: ["mobile-v*"]
    branches: ["mobile/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Tauri CLI builds the phone app, not the Windows one.
  TAURI_APP_PATH: backend/mobile
  TAURI_FRONTEND_PATH: .

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the app version
        id: read
        run: |
          version=$(node -p "require('./backend/mobile/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/mobile/Cargo.toml | head -1)
          if [ "$cargo" != "$version" ]; then
            echo "::error::tauri.conf.json is $version but backend/mobile/Cargo.toml is $cargo"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ] && [ "mobile-v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match the app version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: android

      - run: npm ci

      - run: npx vite build --mode mobile

      # The runner's newest NDK (its own variable, not one the workflow sets).
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Make the Android project
        run: |
          npx tauri android init --ci
          npx tauri icon backend/icons/app-icon.svg
          # A backup to Google Drive would carry the account's session along.
          manifest=backend/mobile/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$manifest"
          grep -n 'allowBackup\|android:scheme' "$manifest" || true

      - name: Build the APK
        run: npx tauri android build --apk --ci --target aarch64 --target armv7

      - name: Sign it
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          unsigned=$(find backend/mobile/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          if [ -z "$unsigned" ]; then
            echo "::error::No unsigned APK was built"
            find backend/mobile/gen/android/app/build/outputs -name '*.apk'
            exit 1
          fi
          echo "Built $unsigned"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          key="$RUNNER_TEMP/myle.p12"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$key"
          keytool -list -keystore "$key" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias myle > /dev/null
          mkdir -p out
          # 16 KB pages: what Android 15 devices need from the .so files.
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-type PKCS12 --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias myle --out out/MYLE-Passwords.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$key"
          "$tools/apksigner" verify --print-certs out/MYLE-Passwords.apk
          unzip -l out/MYLE-Passwords.apk | grep 'lib/.*\.so'
          # The sign-in comes back through this link.
          manifest=$("$tools/aapt2" dump xmltree --file AndroidManifest.xml out/MYLE-Passwords.apk)
          echo "$manifest" | grep -E 'package=|versionCode|versionName|allowBackup|scheme' || true
          if ! echo "$manifest" | grep -q ':scheme([^)]*)="uk.thomast.myle.passwords"'; then
            echo "::warning::The APK's manifest shows no uk.thomast.myle.passwords scheme"
          fi
          if ! unzip -l out/MYLE-Passwords.apk | grep -q 'lib/arm64-v8a/libmyle_passwords_lib.so'; then
            echo "::error::The APK has no arm64 library"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MYLE-Passwords-android
          path: out/MYLE-Passwords.apk
          retention-days: 7

  ios:
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Xcode 27 does not build Tauri's iOS apps yet.
      - name: Use Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner"
            ls /Applications
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ios

      - run: brew list xcodegen > /dev/null 2>&1 || brew install xcodegen

      - run: npm ci

      - run: npx vite build --mode mobile

      - name: Make the Xcode project
        run: |
          npx tauri ios init --ci
          npx tauri icon backend/icons/app-icon.svg

      # Unsigned: SideStore signs it on the phone with the user's Apple ID.
      - name: Build the IPA
        run: npx tauri ios build --ci --target aarch64 --no-sign

      - name: Check it
        run: |
          ipa=$(find backend/mobile/gen/apple -name '*.ipa' | head -1)
          if [ -z "$ipa" ]; then
            echo "::error::No IPA was built"
            exit 1
          fi
          echo "Built $ipa"
          mkdir -p out
          cp "$ipa" out/MYLE-Passwords.ipa
          unpacked=$(mktemp -d)
          unzip -q out/MYLE-Passwords.ipa -d "$unpacked"
          app=$(ls -d "$unpacked"/Payload/*.app)
          plist="$app/Info.plist"
          binary="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          lipo -info "$binary"
          lipo -info "$binary" | grep -q arm64
          for key in CFBundleIdentifier CFBundleShortVersionString MinimumOSVersion CFBundleURLTypes NSFaceIDUsageDescription NSCameraUsageDescription; do
            echo "$key: $(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" | tr '\n' ' ')"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = uk.thomast.myle.passwords
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$plist" | grep -q uk.thomast.myle.passwords

      - uses: actions/upload-artifact@v4
        with:
          name: MYLE-Passwords-ios
          path: out/MYLE-Passwords.ipa
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: [version, android, ios]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: MYLE-Passwords-*
          merge-multiple: true
          path: out

      - name: Make the feeds
        run: |
          # The app's own feed address, so the upload can never drift from it.
          base=$(sed -n 's#^pub const FEED: &str = "\(.*\)/mobile-latest\.json";#\1#p' backend/mobile/src/update.rs)
          if [ -z "$base" ]; then
            echo "::error::No FEED in backend/mobile/src/update.rs"
            exit 1
          fi
          echo "FEED_BASE=$base" >> "$GITHUB_ENV"
          node scripts/mobile-feeds.mjs --version "$VERSION" --tag "${{ github.ref_name }}" --base "$base" \
            --repo "${{ github.repository }}" --apk out/MYLE-Passwords.apk --ipa out/MYLE-Passwords.ipa --out out

      - name: Publish to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          publish() {
            local file=$1 key=$2
            shift 2
            aws s3 cp "$file" "s3://$R2_BUCKET/$key" --endpoint-url "$endpoint" "$@"
          }
          served() {
            local key=$1 file=$2
            actual=$(curl -fsSL -H 'Cache-Control: no-cache' "$FEED_BASE/$key" | sha256sum | cut -d' ' -f1)
            expected=$(sha256sum "$file" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$key served by $FEED_BASE does not match the build"
              exit 1
            fi
            echo "Verified $FEED_BASE/$key"
          }
          publish out/MYLE-Passwords.apk MYLE-Passwords.apk --content-type application/vnd.android.package-archive --cache-control no-cache
          served MYLE-Passwords.apk out/MYLE-Passwords.apk
          publish out/MYLE-Passwords.ipa MYLE-Passwords.ipa --content-type application/octet-stream --cache-control no-cache
          served MYLE-Passwords.ipa out/MYLE-Passwords.ipa
          publish backend/icons/icon.png myle-passwords-icon.png --content-type image/png
          publish out/sidestore.json sidestore.json --content-type application/json --cache-control no-cache
          served sidestore.json out/sidestore.json
          # The feed goes last: phones only see a version once its files are live.
          publish out/mobile-latest.json mobile-latest.json --content-type application/json --cache-control no-cache
          served mobile-latest.json out/mobile-latest.json

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hand-written notes when docs/release-notes/mobile-<version>.md
          # exists. Never "latest": that stays the Windows app's.
          notes="docs/release-notes/mobile-$VERSION.md"
          if [ -f "$notes" ]; then body=(--notes-file "$notes"); else body=(--generate-notes); fi
          files=(out/MYLE-Passwords.apk out/MYLE-Passwords.ipa)
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
          else
            gh release create "${{ github.ref_name }}" "${files[@]}" \
              --title "MYLE Passwords $VERSION" "${body[@]}" --latest=false
          fi

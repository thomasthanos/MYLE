# Builds MYLE Passwords, the Password Manager for phones (backend/mobile): an
# APK for Android, signed with the project's key, and an unsigned IPA for
# iPhones, which SideStore signs with the user's own Apple ID.
#
# Release, together with the Windows app: the tag v1.2.3 (release.yml) also
# builds these, with the same version in backend/mobile/tauri.conf.json and
# backend/mobile/Cargo.toml, into the same GitHub release. On its own: the tag
# mobile-v1.2.3, a release of its own that is never GitHub's "latest".
# A tag v1.2.3 whose message has the line "Build: windows" (MYLE's Release
# Hub, "Windows .exe only") skips the phone builds; "Build: full" or no such
# line builds everything.
# Either way it publishes to Cloudflare R2 (downloads.thomast.uk)
# MYLE-Passwords-<version>.apk and .ipa (and the same files without the
# version, for links), sidestore.json (the SideStore source) and, last,
# mobile-latest.json (Android's update check).
#
# Run by hand (Actions > MYLE Passwords > Run workflow), or push a branch
# named mobile/..., for a dry run: the same builds, kept as artifacts.
#
# The Android key: GitHub secrets ANDROID_KEYSTORE_B64 (the PKCS12 file,
# base64) and ANDROID_KEYSTORE_PASSWORD, alias "myle". Losing it means
# installed copies can never be updated.
name: MYLE Passwords

on:
  push:
    tags: ["mobile-v*", "v*"]
    branches: ["mobile/**"]
  workflow_dispatch:
    inputs:
      target:
        description: "full: build the phone apps; windows: skip them"
        type: choice
        options: [full, windows]
        default: full

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  # Optional: the sign-in start page (docs/auth-worker.js), set as a
  # repository variable once deployed; empty uses Supabase directly.
  MYLE_AUTH_URL: ${{ vars.MYLE_AUTH_URL }}
  # The Tauri CLI builds the phone app, not the Windows one.
  TAURI_APP_PATH: backend/mobile
  TAURI_FRONTEND_PATH: .

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.read.outputs.build }}
      checks: ${{ steps.read.outputs.checks }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the app version
        id: read
        run: |
          version=$(node -p "require('./backend/mobile/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/mobile/Cargo.toml | head -1)
          if [ "$cargo" != "$version" ]; then
            echo "::error::tauri.conf.json is $version but backend/mobile/Cargo.toml is $cargo"
            exit 1
          fi
          tag="${{ github.ref_name }}"
          build=true
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [[ "$tag" == mobile-v* ]] && [ "mobile-v$version" != "$tag" ]; then
              echo "::error::Tag $tag does not match MYLE Passwords' version $version"
              exit 1
            fi
            # A Windows release whose version the phone app does not have:
            # nothing to build for phones this time.
            if [[ "$tag" == v* ]] && [ "v$version" != "$tag" ]; then
              echo "::notice::MYLE Passwords is $version, not ${tag#v}: no phone builds for $tag"
              build=false
            fi
            # MYLE's Release Hub writes "Build: windows" into the tag's
            # message for a Windows-only release: no phone builds then.
            if [[ "$tag" == v* ]] && [ "$build" = true ]; then
              git fetch --force --depth=1 origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
              if git tag -l --format='%(contents)' "$tag" | grep -qi '^Build: *windows'; then
                echo "::notice::$tag is a Windows-only release (Build: windows): no phone builds"
                build=false
              fi
            fi
          fi
          if [ "${{ inputs.target }}" = "windows" ]; then
            echo "::notice::Run by hand for Windows only: no phone builds"
            build=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          checks=true
          if [ "${{ github.ref_type }}" = "tag" ] && git for-each-ref --format='%(contents)' "refs/tags/$tag" | grep -qx 'Checks: skip'; then
            checks=false
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: android

      - run: npm ci

      - run: npx vite build --mode mobile

      # The runner's newest NDK (its own variable, not one the workflow sets).
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Make the Android project
        run: |
          npx tauri android init --ci
          npx tauri icon backend/icons/app-icon.svg
          # Tauri's template has Kotlin 1.9; the biometrics plugin's libraries
          # (kotlinx-coroutines 1.10) need 2.1.
          root=backend/mobile/gen/android/build.gradle.kts
          sed -i 's/kotlin-gradle-plugin:1\.9\.[0-9]*/kotlin-gradle-plugin:2.1.21/' "$root"
          grep -q 'kotlin-gradle-plugin:2.1.21' "$root" || { echo "::error::Kotlin was not raised in $root"; cat "$root"; exit 1; }
          # The native plugin also declares allowBackup=false, including when
          # the app template omits it. Older templates explicitly enable it.
          manifest=backend/mobile/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$manifest"
          grep -n 'allowBackup\|android:scheme' "$manifest" || true

      - name: Build the APK
        run: npx tauri android build --apk --ci --target aarch64 --target armv7

      # tauri-build generates tauri.settings.gradle and the plugin projects
      # during the Rust build; android init alone does not create them.
      - name: Test native credential provider
        if: needs.version.outputs.checks != 'false'
        working-directory: backend/mobile/gen/android
        run: ./gradlew :tauri-plugin-myle-mobile:testDebugUnitTest :tauri-plugin-myle-mobile:assembleDebug

      - name: Sign it
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          unsigned=$(find backend/mobile/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          if [ -z "$unsigned" ]; then
            echo "::error::No unsigned APK was built"
            find backend/mobile/gen/android/app/build/outputs -name '*.apk'
            exit 1
          fi
          echo "Built $unsigned"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          key="$RUNNER_TEMP/myle.p12"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$key"
          keytool -list -keystore "$key" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias myle > /dev/null
          mkdir -p out
          # 16 KB pages: what Android 15 devices need from the .so files.
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-type PKCS12 --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias myle --out out/MYLE-Passwords.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$key"
          "$tools/apksigner" verify --print-certs out/MYLE-Passwords.apk
          unzip -l out/MYLE-Passwords.apk | grep 'lib/.*\.so'
          # The sign-in comes back through this link.
          manifest=$("$tools/aapt2" dump xmltree --file AndroidManifest.xml out/MYLE-Passwords.apk)
          echo "$manifest" | grep -E 'package=|versionCode|versionName|allowBackup|scheme' || true
          if ! echo "$manifest" | grep -Eq ':allowBackup\([^)]*\)=(false|\(type 0x12\)0x0)([[:space:]]|$)'; then
            echo "::error::The merged APK must explicitly disable Android backup"
            exit 1
          fi
          # Autofill reads the requesting app's certificate; Android 11+ hides
          # apps that the native plugin's <queries> do not name.
          if ! echo "$manifest" | grep -q 'E: queries'; then
            echo "::error::The merged APK has lost the native plugin's <queries>"
            exit 1
          fi
          if ! echo "$manifest" | grep -q ':scheme([^)]*)="uk.thomast.myle.passwords"'; then
            echo "::warning::The APK's manifest shows no uk.thomast.myle.passwords scheme"
          fi
          if ! unzip -l out/MYLE-Passwords.apk | grep -q 'lib/arm64-v8a/libmyle_passwords_lib.so'; then
            echo "::error::The APK has no arm64 library"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MYLE-Passwords-android
          path: out/MYLE-Passwords.apk
          retention-days: 7

  ios:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Xcode 27 does not build Tauri's iOS apps yet.
      - name: Use Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner"
            ls /Applications
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ios

      - run: brew list xcodegen > /dev/null 2>&1 || brew install xcodegen

      - run: npm ci

      - run: npx vite build --mode mobile

      - name: Make the Xcode project
        run: |
          npx tauri ios init --ci
          npx tauri icon backend/icons/app-icon.svg
          # The icon in its three looks: light (the default), dark and tinted
          # (iOS 18+: Home Screen > Edit > Customize).
          set=$(find backend/mobile/gen/apple -type d -name AppIcon.appiconset | head -1)
          if [ -z "$set" ]; then
            echo "::error::No AppIcon.appiconset in the Xcode project"
            exit 1
          fi
          rm -f "$set"/*
          cp backend/mobile/ios-icon/Contents.json "$set/"
          for look in light dark tinted; do
            cp "backend/icons/app-icon-$look.png" "$set/AppIcon-$look.png"
          done
          ls -la "$set"

      # Unsigned: SideStore signs it on the phone with the user's Apple ID.
      - name: Build the IPA
        run: npx tauri ios build --ci --target aarch64 --no-sign

      - name: Check it
        run: |
          ipa=$(find backend/mobile/gen/apple -name '*.ipa' | head -1)
          if [ -z "$ipa" ]; then
            echo "::error::No IPA was built"
            exit 1
          fi
          echo "Built $ipa"
          mkdir -p out
          cp "$ipa" out/MYLE-Passwords.ipa
          unpacked=$(mktemp -d)
          unzip -q out/MYLE-Passwords.ipa -d "$unpacked"
          app=$(ls -d "$unpacked"/Payload/*.app)
          plist="$app/Info.plist"
          binary="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          lipo -info "$binary"
          lipo -info "$binary" | grep -q arm64
          for key in CFBundleIdentifier CFBundleShortVersionString MinimumOSVersion CFBundleURLTypes NSFaceIDUsageDescription NSCameraUsageDescription; do
            echo "$key: $(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" | tr '\n' ' ')"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = uk.thomast.myle.passwords
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$plist" | grep -q uk.thomast.myle.passwords

      - uses: actions/upload-artifact@v4
        with:
          name: MYLE-Passwords-ios
          path: out/MYLE-Passwords.ipa
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: [version, android, ios]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: MYLE-Passwords-*
          merge-multiple: true
          path: out

      - name: Make the feeds
        run: |
          # The app's own feed address, so the upload can never drift from it.
          base=$(sed -n 's#^pub const FEED: &str = "\(.*\)/mobile-latest\.json";#\1#p' backend/mobile/src/update.rs)
          if [ -z "$base" ]; then
            echo "::error::No FEED in backend/mobile/src/update.rs"
            exit 1
          fi
          echo "FEED_BASE=$base" >> "$GITHUB_ENV"
          node scripts/mobile-feeds.mjs --version "$VERSION" --tag "${{ github.ref_name }}" --base "$base" \
            --repo "${{ github.repository }}" --apk out/MYLE-Passwords.apk --ipa out/MYLE-Passwords.ipa --out out

      - name: Publish to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          publish() {
            local file=$1 key=$2
            shift 2
            aws s3 cp "$file" "s3://$R2_BUCKET/$key" --endpoint-url "$endpoint" "$@"
          }
          served() {
            local key=$1 file=$2
            actual=$(curl -fsSL -H 'Cache-Control: no-cache' "$FEED_BASE/$key" | sha256sum | cut -d' ' -f1)
            expected=$(sha256sum "$file" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$key served by $FEED_BASE does not match the build"
              exit 1
            fi
            echo "Verified $FEED_BASE/$key"
          }
          apk=(--content-type application/vnd.android.package-archive --cache-control no-cache)
          # The app downloads this version's own file (mobile-latest.json): no
          # cache can hand out the previous APK under that name.
          publish out/MYLE-Passwords.apk "MYLE-Passwords-$VERSION.apk" "${apk[@]}"
          served "MYLE-Passwords-$VERSION.apk" out/MYLE-Passwords.apk
          # For links to "the latest APK" (the site, the README).
          publish out/MYLE-Passwords.apk MYLE-Passwords.apk "${apk[@]}"
          served MYLE-Passwords.apk out/MYLE-Passwords.apk
          ipa=(--content-type application/octet-stream --cache-control no-cache)
          publish out/MYLE-Passwords.ipa "MYLE-Passwords-$VERSION.ipa" "${ipa[@]}"
          served "MYLE-Passwords-$VERSION.ipa" out/MYLE-Passwords.ipa
          publish out/MYLE-Passwords.ipa MYLE-Passwords.ipa "${ipa[@]}"
          served MYLE-Passwords.ipa out/MYLE-Passwords.ipa
          publish backend/icons/icon.png myle-passwords-icon.png --content-type image/png
          publish out/sidestore.json sidestore.json --content-type application/json --cache-control no-cache
          served sidestore.json out/sidestore.json
          # The feed goes last: phones only see a version once its files are live.
          publish out/mobile-latest.json mobile-latest.json --content-type application/json --cache-control no-cache
          served mobile-latest.json out/mobile-latest.json

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          files=(out/MYLE-Passwords.apk out/MYLE-Passwords.ipa)
          if [[ "$tag" == mobile-v* ]]; then
            # A phone release of its own: never "latest", that stays the
            # Windows app's.
            notes="docs/release-notes/mobile-$VERSION.md"
            title="MYLE Passwords $VERSION"
            latest=(--latest=false)
          else
            # The Windows app's release (release.yml makes the same one, with
            # the same title and notes): whichever finishes first creates it.
            notes="docs/release-notes/$VERSION.md"
            title="MYLE $tag"
            latest=(--latest)
          fi
          if [ -f "$notes" ]; then body=(--notes-file "$notes"); else body=(--generate-notes); fi
          if gh release view "$tag" > /dev/null 2>&1 || \
             ! gh release create "$tag" "${files[@]}" --title "$title" "${body[@]}" "${latest[@]}"; then
            gh release upload "$tag" "${files[@]}" --clobber
          fi

      # SideStore reads docs/sidestore.json from the repository too: point it
      # at this release's IPA (version, date, size) and commit it to main.
      - name: Update docs/sidestore.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          size=$(stat -c %s out/MYLE-Passwords.ipa)
          git fetch --depth=1 origin main
          git checkout -B sidestore-update origin/main
          node scripts/update-sidestore.mjs "$size"
          if git diff --quiet docs/sidestore.json; then
            echo "docs/sidestore.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SideStore source: MYLE Passwords $VERSION [skip ci]" docs/sidestore.json
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::warning::Could not push docs/sidestore.json; update it by hand."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Emblem 3D Soft Floating Drop Shadow -->
    <filter id="wand-emblem-shadow" x="16" y="18" width="224" height="224" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Main Deep Graphite / Dark-Zinc 3D Glass Background -->
    <linearGradient id="wand-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D2F36" />
      <stop offset="50%" stop-color="#1B1C21" />
      <stop offset="100%" stop-color="#0D0E11" />
    </linearGradient>

    <!-- Ambient Frosted Specular Glow (Top-Left) -->
    <radialGradient id="wand-glow-top" cx="28%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#71717A" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1B1C21" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Subtle Zinc Reflection (Bottom-Right) -->
    <radialGradient id="wand-glow-bottom" cx="82%" cy="86%" r="62%">
      <stop offset="0%" stop-color="#52525B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0D0E11" stop-opacity="0" />
    </radialGradient>

    <!-- macOS 3D Frosted Glass Bevel Border -->
    <linearGradient id="wand-glass-rim" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.70" />
      <stop offset="25%" stop-color="#E4E4E7" stop-opacity="0.32" />
      <stop offset="75%" stop-color="#27272A" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#A1A1AA" stop-opacity="0.42" />
    </linearGradient>

    <!-- Top Specular Sheen (Curved Glass Reflection) -->
    <linearGradient id="wand-sheen" x1="128" y1="0" x2="128" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Emblem Pure White / Platinum Gradient -->
    <linearGradient id="wand-emblem-grad" x1="128" y1="36" x2="128" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F4F4F6" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>

    <!-- Emblem Crisp Specular Edge Highlight -->
    <linearGradient id="wand-emblem-stroke" x1="128" y1="36" x2="128" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#A1A1AA" stop-opacity="0.25" />
    </linearGradient>

    <!-- macOS Squircle Clip -->
    <clipPath id="wand-squircle-clip">
      <rect x="0" y="0" width="256" height="256" rx="58" />
    </clipPath>
  </defs>

  <!-- Base Squircle & Internal Lighting (Matching macOS 3D Glass) -->
  <g clip-path="url(#wand-squircle-clip)">
    <rect x="0" y="0" width="256" height="256" fill="url(#wand-bg)" />
    <rect x="0" y="0" width="256" height="256" fill="url(#wand-glow-top)" />
    <rect x="0" y="0" width="256" height="256" fill="url(#wand-glow-bottom)" />
    <!-- Top Glass Reflection Curve -->
    <ellipse cx="128" cy="4" rx="126" ry="64" fill="url(#wand-sheen)" />
  </g>

  <!-- 3D Inner Glass Rim -->
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" stroke="url(#wand-glass-rim)" stroke-width="3" />

  <!-- Wand Authentic 3D Glass Emblem -->
  <g filter="url(#wand-emblem-shadow)">
    <!-- 3D Extrusion Depth Layer -->
    <g transform="translate(33, 36) scale(3.8)">
      <path fill="#08090C" fill-opacity="0.80" fill-rule="nonzero" d="M47.845,22.185l-20.03,-20.03c-1.543,-1.543 -4.046,-1.553 -5.729,0.002l-19.931,20.028c-1.542,1.542 -1.554,4.045 0,5.727l19.934,19.934c0.772,0.772 1.785,1.16 2.816,1.16c1.026,0 2.07,-0.385 2.91,-1.16l19.933,-19.934c1.605,-1.605 1.648,-4.175 0.097,-5.727zM18,27c-1.105,0 -2,-0.895 -2,-2c0,-1.105 0.895,-2 2,-2c1.105,0 2,0.895 2,2c0,1.105 -0.895,2 -2,2zM25,34c-1.105,0 -2,-0.895 -2,-2c0,-1.105 0.895,-2 2,-2c1.105,0 2,0.895 2,2c0,1.105 -0.895,2 -2,2zM25,20c-1.105,0 -2,-0.895 -2,-2c0,-1.105 0.895,-2 2,-2c1.105,0 2,0.895 2,2c0,1.105 -0.895,2 -2,2zM32,27c-1.105,0 -2,-0.895 -2,-2c0,-1.105 0.895,-2 2,-2c1.105,0 2,0.895 2,2c0,1.105 -0.895,2 -2,2z" />
    </g>

    <!-- Main Diamond Controller Emblem (Exact WeMod / Wand Shape) -->
    <g transform="translate(33, 33) scale(3.8)">
      <path fill="url(#wand-emblem-grad)" stroke="url(#wand-emblem-stroke)" stroke-width="0.32" stroke-linejoin="round" fill-rule="nonzero" d="M47.845,22.185l-20.03,-20.03c-1.543,-1.543 -4.046,-1.553 -5.729,0.002l-19.931,20.028c-1.542,1.542 -1.554,4.045 0,5.727l19.934,19.934c0.772,0.772 1.785,1.16 2.816,1.16c1.026,0 2.07,-0.385 2.91,-1.16l19.933,-19.934c1.605,-1.605 1.648,-4.175 0.097,-5.727zM18,27c-1.105,0 -2,-0.895 -2,-2c0,-1.105 0.895,-2 2,-2c1.105,0 2,0.895 2,2c0,1.105 -0.895,2 -2,2zM25,34c-1.105,0 -2,-0.895 -2,-2c0,-1.105 0.895,-2 2,-2c1.105,0 2,0.895 2,2c0,1.105 -0.895,2 -2,2zM25,20c-1.105,0 -2,-0.895 -2,-2c0,-1.105 0.895,-2 2,-2c1.105,0 2,0.895 2,2c0,1.105 -0.895,2 -2,2zM32,27c-1.105,0 -2,-0.895 -2,-2c0,-1.105 0.895,-2 2,-2c1.105,0 2,0.895 2,2c0,1.105 -0.895,2 -2,2z" />
    </g>
  </g>
</svg>

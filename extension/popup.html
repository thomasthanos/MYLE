<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MYLE Passwords</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a3acff" />
            <stop offset="1" stop-color="#6b5cf2" />
          </linearGradient>
        </defs>
        <rect x="1" y="1" width="22" height="22" rx="7" fill="url(#mark)" />
        <path d="M12 5.2 17.4 7.3v4.3c0 3.3-2.2 5.8-5.4 7.1-3.2-1.3-5.4-3.8-5.4-7.1V7.3z" fill="#fff" fill-opacity=".96" />
        <circle cx="12" cy="10.7" r="1.7" fill="#6b5cf2" />
        <path d="M11.2 11.9h1.6l.45 2.7h-2.5z" fill="#6b5cf2" />
      </svg>
      <div class="titles">
        <strong>MYLE Passwords</strong>
        <small id="site">…</small>
      </div>
      <span class="count" id="count" hidden></span>
    </header>
    <div class="search" id="search-row" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
      <input id="search" type="search" placeholder="Search logins  ( / )" autocomplete="off" spellcheck="false" aria-label="Search logins" />
    </div>
    <main id="content" aria-live="polite">
      <div class="skeleton" aria-hidden="true"><i></i><i></i><i></i></div>
    </main>
    <p class="toast" id="toast" role="status" hidden></p>
    <footer>
      <button id="scan" type="button" title="Read the site's 2FA QR code on this page, and keep its key in MYLE">2FA from a QR code</button>
      <button id="open" type="button">Open MYLE</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>

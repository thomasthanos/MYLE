[package]
name = "myle-passwords"
# The version users see is tauri.conf.json's; keep the two the same.
version = "9.2.5"
description = "MYLE Passwords: the Password Manager on phones"
authors = ["ThomasThanos"]
edition = "2024"
publish = false

# Phones load the app as a library (Android's .so, iOS's static library).
[lib]
name = "myle_passwords_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
myle-vault = { path = "../vault" }
tauri-plugin-myle-mobile = { path = "plugin" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "fs", "io-util"] }
zeroize = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
sha2 = "0.11"
futures-util = "0.3"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# The same minor version as @tauri-apps/plugin-barcode-scanner in package.json.
tauri-plugin-barcode-scanner = "~2.4"
# A key in the Keychain (iOS) or Keystore (Android) that opens only with the
# user's face, fingerprint or device code. Pinned: the plugin is young.
tauri-plugin-biometry = "=0.2.8"

# Built on Windows too, to try the app there: Windows' own TLS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

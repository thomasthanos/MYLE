<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b" />
      <stop offset=".4" stop-color="#0f172a" />
      <stop offset="1" stop-color="#070b14" />
    </linearGradient>
    <radialGradient id="g-aurora1" cx=".25" cy=".2" r=".75">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".45" />
      <stop offset=".5" stop-color="#6366f1" stop-opacity=".2" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="g-aurora2" cx=".8" cy=".75" r=".7">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".35" />
      <stop offset=".45" stop-color="#06b6d4" stop-opacity=".18" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="g-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".32" />
      <stop offset=".3" stop-color="#ffffff" stop-opacity=".1" />
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0" />
      <stop offset=".85" stop-color="#ffffff" stop-opacity=".05" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".18" />
    </linearGradient>
    <linearGradient id="g-term-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".6" />
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".3" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".15" />
    </linearGradient>
    <linearGradient id="g-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c182c" stop-opacity=".85" />
      <stop offset="1" stop-color="#060c18" stop-opacity=".92" />
    </linearGradient>
    <radialGradient id="g-screen-glow" cx=".5" cy=".95" r=".85">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".55" />
      <stop offset=".5" stop-color="#818cf8" stop-opacity=".25" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="g-desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".7" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="g-hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223b" stop-opacity=".92" />
      <stop offset=".55" stop-color="#0b1324" stop-opacity=".95" />
      <stop offset="1" stop-color="#040812" stop-opacity=".98" />
    </linearGradient>
    <linearGradient id="g-torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131d33" stop-opacity=".92" />
      <stop offset=".5" stop-color="#080e1a" stop-opacity=".95" />
      <stop offset="1" stop-color="#03050b" stop-opacity=".98" />
    </linearGradient>
    <linearGradient id="g-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95" />
      <stop offset=".25" stop-color="#67e8f9" stop-opacity=".85" />
      <stop offset=".65" stop-color="#a855f7" stop-opacity=".5" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <filter id="g-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <path id="g-hood-shape" d="M512 330C470 344 420 384 400 456C386 508 380 584 364 646C426 708 598 708 660 646C644 584 638 508 624 456C604 384 554 344 512 330Z" />
    <path id="g-torso-shape" d="M432 610C336 626 258 666 224 724C194 776 186 866 184 1024H840C838 866 830 776 800 724C766 666 688 626 592 610Z" />
    <clipPath id="g-hood-clip"><use href="#g-hood-shape" /></clipPath>
    <clipPath id="g-torso-clip"><use href="#g-torso-shape" /></clipPath>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1024" height="1024" fill="url(#g-bg)" />
  <rect width="1024" height="1024" fill="url(#g-aurora1)" />
  <rect width="1024" height="1024" fill="url(#g-aurora2)" />

  <!-- Ambient cyber data columns -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="8" opacity=".22">
    <path d="M136 210v70M136 310v110M136 450v50M176 180v95M176 305v65M176 400v85" />
    <path d="M848 190v85M848 305v70M848 405v80M888 220v60M888 310v105M888 445v45" />
  </g>

  <!-- Full-bleed Glass Desk -->
  <rect x="0" y="652" width="1024" height="372" fill="#060c18" opacity=".7" />
  <rect x="0" y="652" width="1024" height="372" fill="url(#g-sheen)" opacity=".4" />
  <rect x="0" y="646" width="1024" height="8" fill="url(#g-desk)" />

  <!-- Frosted Glass Cyber Terminal -->
  <rect x="222" y="168" width="580" height="424" rx="42" fill="#ffffff" fill-opacity=".08" />
  <rect x="222" y="168" width="580" height="424" rx="42" fill="#081020" fill-opacity=".75" />
  <rect x="224" y="170" width="576" height="420" rx="40" fill="none" stroke="url(#g-term-border)" stroke-width="4" />
  
  <circle cx="264" cy="191" r="7" fill="#fb7185" opacity=".95" />
  <circle cx="288" cy="191" r="7" fill="#fbbf24" opacity=".95" />
  <circle cx="312" cy="191" r="7" fill="#34d399" opacity=".95" />
  <path d="M348 191h120" stroke="#ffffff" stroke-opacity=".3" stroke-width="8" stroke-linecap="round" />
  
  <rect x="248" y="212" width="528" height="354" rx="22" fill="url(#g-screen)" />
  <rect x="248" y="212" width="528" height="354" rx="22" fill="url(#g-screen-glow)" />

  <!-- Commands & prompt -->
  <path d="M280 246L302 262L280 278" fill="none" stroke="#34d399" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <g stroke-linecap="round" stroke-width="20">
    <path d="M326 262h92" stroke="#34d399" />
    <path d="M440 262h164" stroke="#38bdf8" />
    <path d="M334 310h76" stroke="#c084fc" />
    <path d="M432 310h196" stroke="#ffffff" stroke-opacity=".9" />
    <path d="M334 358h132" stroke="#38bdf8" />
    <path d="M488 358h108" stroke="#fbbf24" />
    <path d="M618 358h68" stroke="#34d399" stroke-opacity=".7" />
    <path d="M374 406h142" stroke="#818cf8" />
    <path d="M538 406h84" stroke="#38bdf8" stroke-opacity=".8" />
    <path d="M334 454h88" stroke="#c084fc" />
    <path d="M298 502h64" stroke="#34d399" />
  </g>
  <rect x="382" y="488" width="18" height="28" rx="4" fill="#34d399" />
  <path d="M732 234c2.6 17.6 10 25 27.6 27.6-17.6 2.6-25 10-27.6 27.6-2.6-17.6-10-25-27.6-27.6 17.6-2.6 25-10 27.6-27.6z" fill="#ffffff" opacity=".95" />

  <!-- Smoked Glass Hacker Silhouette -->
  <use href="#g-torso-shape" fill="url(#g-torso)" />
  <g clip-path="url(#g-torso-clip)">
    <use href="#g-torso-shape" fill="none" stroke="url(#g-edge)" stroke-width="20" filter="url(#g-soft)" />
    <use href="#g-torso-shape" fill="none" stroke="url(#g-edge)" stroke-width="7" opacity=".9" />
    <path d="M372 634L256 748M652 634L768 748" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="6" stroke-linecap="round" />
    <ellipse cx="512" cy="684" rx="156" ry="46" fill="#03060d" opacity=".8" filter="url(#g-soft)" />
  </g>
  <use href="#g-hood-shape" fill="url(#g-hood)" />
  <g clip-path="url(#g-hood-clip)">
    <use href="#g-hood-shape" fill="none" stroke="url(#g-edge)" stroke-width="22" filter="url(#g-soft)" />
    <use href="#g-hood-shape" fill="none" stroke="url(#g-edge)" stroke-width="7.5" />
    <path d="M512 336V690" stroke="#020408" stroke-opacity=".7" stroke-width="7" />
    <path d="M448 402C430 486 420 572 406 654M576 402C594 486 604 572 618 654" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="6" stroke-linecap="round" />
    <path d="M364 646C426 708 598 708 660 646" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="7" />
  </g>

  <!-- Full-bleed Glass surface gloss sheen -->
  <rect width="1024" height="1024" fill="url(#g-sheen)" />
</svg>
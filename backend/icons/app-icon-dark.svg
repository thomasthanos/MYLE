<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MYLE Passwords iOS Icon: DARK Edition (Deep AMOLED Stealth) -->
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090d16" />
      <stop offset=".45" stop-color="#04060a" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="d-spill" cx=".5" cy=".38" r=".6">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".36" />
      <stop offset=".45" stop-color="#3b82f6" stop-opacity=".18" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="d-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".45" />
      <stop offset=".5" stop-color="#1e293b" stop-opacity=".2" />
      <stop offset="1" stop-color="#0284c7" stop-opacity=".3" />
    </linearGradient>
    <linearGradient id="d-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030712" />
      <stop offset="1" stop-color="#020408" />
    </linearGradient>
    <radialGradient id="d-glow" cx=".5" cy=".95" r=".8">
      <stop offset="0" stop-color="#00f5ff" stop-opacity=".45" />
      <stop offset=".5" stop-color="#3b82f6" stop-opacity=".15" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="d-hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset=".6" stop-color="#040711" />
      <stop offset="1" stop-color="#010204" />
    </linearGradient>
    <linearGradient id="d-torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1120" />
      <stop offset=".6" stop-color="#030509" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="d-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset=".4" stop-color="#06b6d4" stop-opacity=".7" />
      <stop offset=".8" stop-color="#6366f1" stop-opacity=".3" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <filter id="d-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <clipPath id="d-tile">
      <rect x="64" y="64" width="896" height="896" rx="220" />
    </clipPath>
    <path id="d-hood-shape" d="M512 330C470 344 420 384 400 456C386 508 380 584 364 646C426 708 598 708 660 646C644 584 638 508 624 456C604 384 554 344 512 330Z" />
    <path id="d-torso-shape" d="M432 610C336 626 258 666 224 724C194 776 186 866 184 1000H840C838 866 830 776 800 724C766 666 688 626 592 610Z" />
    <clipPath id="d-hood-clip"><use href="#d-hood-shape" /></clipPath>
    <clipPath id="d-torso-clip"><use href="#d-torso-shape" /></clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#d-bg)" />
  <g clip-path="url(#d-tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#d-spill)" />

    <!-- Ambient data streams -->
    <g stroke="#0ea5e9" stroke-linecap="round" stroke-width="7" opacity=".12">
      <path d="M136 210v70M136 310v110M176 180v95M176 305v65M848 190v85M848 305v70M888 220v60M888 310v105" />
    </g>

    <!-- Terminal Frame -->
    <rect x="222" y="168" width="580" height="424" rx="42" fill="#03050a" />
    <rect x="224" y="170" width="576" height="420" rx="40" fill="none" stroke="#0284c7" stroke-opacity=".28" stroke-width="3" />
    <circle cx="264" cy="191" r="7" fill="#f43f5e" opacity=".75" />
    <circle cx="288" cy="191" r="7" fill="#eab308" opacity=".75" />
    <circle cx="312" cy="191" r="7" fill="#10b981" opacity=".85" />
    <path d="M348 191h120" stroke="#0ea5e9" stroke-opacity=".2" stroke-width="8" stroke-linecap="round" />
    <rect x="248" y="212" width="528" height="354" rx="22" fill="url(#d-screen)" />
    <rect x="248" y="212" width="528" height="354" rx="22" fill="url(#d-glow)" />

    <!-- Terminal text -->
    <path d="M280 246L302 262L280 278" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <g stroke-linecap="round" stroke-width="20">
      <path d="M326 262h92" stroke="#10b981" />
      <path d="M440 262h164" stroke="#06b6d4" />
      <path d="M334 310h76" stroke="#a855f7" />
      <path d="M432 310h196" stroke="#94a3b8" stroke-opacity=".65" />
      <path d="M334 358h132" stroke="#38bdf8" />
      <path d="M488 358h108" stroke="#f59e0b" />
      <path d="M618 358h68" stroke="#10b981" stroke-opacity=".55" />
      <path d="M374 406h142" stroke="#6366f1" />
      <path d="M538 406h84" stroke="#06b6d4" stroke-opacity=".65" />
      <path d="M334 454h88" stroke="#a855f7" />
      <path d="M298 502h64" stroke="#10b981" />
    </g>
    <rect x="382" y="488" width="18" height="28" rx="4" fill="#10b981" />
    <path d="M732 234c2.6 17.6 10 25 27.6 27.6-17.6 2.6-25 10-27.6 27.6-2.6-17.6-10-25-27.6-27.6 17.6-2.6 25-10 27.6-27.6z" fill="#38bdf8" opacity=".85" />

    <!-- Hooded silhouette -->
    <use href="#d-torso-shape" fill="url(#d-torso)" />
    <g clip-path="url(#d-torso-clip)">
      <use href="#d-torso-shape" fill="none" stroke="url(#d-edge)" stroke-width="16" filter="url(#d-soft)" />
      <use href="#d-torso-shape" fill="none" stroke="url(#d-edge)" stroke-width="5" opacity=".9" />
    </g>
    <use href="#d-hood-shape" fill="url(#d-hood)" />
    <g clip-path="url(#d-hood-clip)">
      <use href="#d-hood-shape" fill="none" stroke="url(#d-edge)" stroke-width="18" filter="url(#d-soft)" />
      <use href="#d-hood-shape" fill="none" stroke="url(#d-edge)" stroke-width="5.5" />
      <path d="M512 336V690" stroke="#000000" stroke-opacity=".8" stroke-width="7" />
    </g>
  </g>
  <rect x="70" y="70" width="884" height="884" rx="214" fill="none" stroke="url(#d-rim)" stroke-width="10" />
</svg>

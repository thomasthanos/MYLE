<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a" />
      <stop offset=".45" stop-color="#04060b" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="d-spill" cx=".5" cy=".38" r=".65">
      <stop offset="0" stop-color="#00f5ff" stop-opacity=".55" />
      <stop offset=".4" stop-color="#6366f1" stop-opacity=".32" />
      <stop offset=".75" stop-color="#10b981" stop-opacity=".1" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="d-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040d1a" />
      <stop offset="1" stop-color="#02060f" />
    </linearGradient>
    <radialGradient id="d-screen-glow" cx=".5" cy=".95" r=".85">
      <stop offset="0" stop-color="#00f5ff" stop-opacity=".65" />
      <stop offset=".5" stop-color="#4f46e5" stop-opacity=".25" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="d-desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0" />
      <stop offset=".5" stop-color="#00f5ff" stop-opacity=".9" />
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="d-hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111728" />
      <stop offset=".55" stop-color="#060912" />
      <stop offset="1" stop-color="#010205" />
    </linearGradient>
    <linearGradient id="d-torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1320" />
      <stop offset=".5" stop-color="#04060c" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="d-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f5ff" />
      <stop offset=".3" stop-color="#34d399" stop-opacity=".9" />
      <stop offset=".68" stop-color="#818cf8" stop-opacity=".5" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <filter id="d-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <path id="d-hood-shape" d="M512 330C470 344 420 384 400 456C386 508 380 584 364 646C426 708 598 708 660 646C644 584 638 508 624 456C604 384 554 344 512 330Z" />
    <path id="d-torso-shape" d="M432 610C336 626 258 666 224 724C194 776 186 866 184 1024H840C838 866 830 776 800 724C766 666 688 626 592 610Z" />
    <clipPath id="d-hood-clip"><use href="#d-hood-shape" /></clipPath>
    <clipPath id="d-torso-clip"><use href="#d-torso-shape" /></clipPath>
  </defs>

  <!-- Full-bleed background: 0 0 1024 1024 edge-to-edge -->
  <rect width="1024" height="1024" fill="url(#d-bg)" />
  <rect width="1024" height="1024" fill="url(#d-spill)" />

  <!-- Ambient background cyber data columns -->
  <g stroke="#00f5ff" stroke-linecap="round" stroke-width="8" opacity=".22">
    <path d="M136 210v70M136 310v110M136 450v50M176 180v95M176 305v65M176 400v85" />
    <path d="M848 190v85M848 305v70M848 405v80M888 220v60M888 310v105M888 445v45" />
  </g>

  <!-- Full-bleed Desk -->
  <rect x="0" y="652" width="1024" height="372" fill="#010206" opacity=".92" />
  <rect x="0" y="646" width="1024" height="8" fill="url(#d-desk)" />

  <!-- Cyber Terminal -->
  <rect x="222" y="168" width="580" height="424" rx="42" fill="#03050c" />
  <rect x="224" y="170" width="576" height="420" rx="40" fill="none" stroke="#00f5ff" stroke-opacity=".38" stroke-width="4" />
  <circle cx="264" cy="191" r="7" fill="#fb7185" opacity=".9" />
  <circle cx="288" cy="191" r="7" fill="#fbbf24" opacity=".9" />
  <circle cx="312" cy="191" r="7" fill="#34d399" opacity=".95" />
  <path d="M348 191h120" stroke="#00f5ff" stroke-opacity=".35" stroke-width="8" stroke-linecap="round" />
  <rect x="248" y="212" width="528" height="354" rx="22" fill="url(#d-screen)" />
  <rect x="248" y="212" width="528" height="354" rx="22" fill="url(#d-screen-glow)" />

  <!-- Root > prompt, terminal commands, cursor and cyber sparkle -->
  <path d="M280 246L302 262L280 278" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <g stroke-linecap="round" stroke-width="20">
    <path d="M326 262h92" stroke="#10b981" />
    <path d="M440 262h164" stroke="#00f5ff" />
    <path d="M334 310h76" stroke="#c084fc" />
    <path d="M432 310h196" stroke="#ffffff" stroke-opacity=".85" />
    <path d="M334 358h132" stroke="#38bdf8" />
    <path d="M488 358h108" stroke="#fbbf24" />
    <path d="M618 358h68" stroke="#34d399" stroke-opacity=".7" />
    <path d="M374 406h142" stroke="#818cf8" />
    <path d="M538 406h84" stroke="#00f5ff" stroke-opacity=".8" />
    <path d="M334 454h88" stroke="#c084fc" />
    <path d="M298 502h64" stroke="#10b981" />
  </g>
  <rect x="382" y="488" width="18" height="28" rx="4" fill="#10b981" />
  <path d="M732 234c2.6 17.6 10 25 27.6 27.6-17.6 2.6-25 10-27.6 27.6-2.6-17.6-10-25-27.6-27.6 17.6-2.6 25-10 27.6-27.6z" fill="#00f5ff" opacity=".95" />

  <!-- Hacker silhouette -->
  <use href="#d-torso-shape" fill="url(#d-torso)" />
  <g clip-path="url(#d-torso-clip)">
    <use href="#d-torso-shape" fill="none" stroke="url(#d-edge)" stroke-width="20" filter="url(#d-soft)" />
    <use href="#d-torso-shape" fill="none" stroke="url(#d-edge)" stroke-width="6.5" opacity=".9" />
    <path d="M372 634L256 748M652 634L768 748" fill="none" stroke="#00f5ff" stroke-opacity=".25" stroke-width="6" stroke-linecap="round" />
    <ellipse cx="512" cy="684" rx="156" ry="46" fill="#010205" opacity=".9" filter="url(#d-soft)" />
  </g>
  <use href="#d-hood-shape" fill="url(#d-hood)" />
  <g clip-path="url(#d-hood-clip)">
    <use href="#d-hood-shape" fill="none" stroke="url(#d-edge)" stroke-width="22" filter="url(#d-soft)" />
    <use href="#d-hood-shape" fill="none" stroke="url(#d-edge)" stroke-width="7" />
    <path d="M512 336V690" stroke="#010204" stroke-opacity=".7" stroke-width="7" />
    <path d="M448 402C430 486 420 572 406 654M576 402C594 486 604 572 618 654" fill="none" stroke="#00f5ff" stroke-opacity=".25" stroke-width="6" stroke-linecap="round" />
    <path d="M364 646C426 708 598 708 660 646" fill="none" stroke="#00f5ff" stroke-opacity=".45" stroke-width="7" />
  </g>
</svg>
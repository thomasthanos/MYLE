<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1f" />
      <stop offset=".5" stop-color="#141416" />
      <stop offset="1" stop-color="#0d0d0f" />
    </linearGradient>
    <radialGradient id="t-spill" cx=".5" cy=".38" r=".65">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15" />
      <stop offset=".5" stop-color="#a1a1aa" stop-opacity=".06" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="t-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181b" />
      <stop offset="1" stop-color="#101012" />
    </linearGradient>
    <radialGradient id="t-screen-glow" cx=".5" cy=".95" r=".85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".25" />
      <stop offset=".5" stop-color="#a1a1aa" stop-opacity=".1" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="t-desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".7" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="t-hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242428" />
      <stop offset=".55" stop-color="#18181c" />
      <stop offset="1" stop-color="#0f0f12" />
    </linearGradient>
    <linearGradient id="t-torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f23" />
      <stop offset=".5" stop-color="#141417" />
      <stop offset="1" stop-color="#0c0c0e" />
    </linearGradient>
    <linearGradient id="t-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".3" stop-color="#e4e4e7" stop-opacity=".9" />
      <stop offset=".68" stop-color="#a1a1aa" stop-opacity=".5" />
      <stop offset="1" stop-color="#71717a" stop-opacity="0" />
    </linearGradient>
    <filter id="t-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <path id="t-hood-shape" d="M512 330C470 344 420 384 400 456C386 508 380 584 364 646C426 708 598 708 660 646C644 584 638 508 624 456C604 384 554 344 512 330Z" />
    <path id="t-torso-shape" d="M432 610C336 626 258 666 224 724C194 776 186 866 184 1024H840C838 866 830 776 800 724C766 666 688 626 592 610Z" />
    <clipPath id="t-hood-clip"><use href="#t-hood-shape" /></clipPath>
    <clipPath id="t-torso-clip"><use href="#t-torso-shape" /></clipPath>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1024" height="1024" fill="url(#t-bg)" />
  <rect width="1024" height="1024" fill="url(#t-spill)" />

  <!-- Ambient cyber data columns -->
  <g stroke="#71717a" stroke-linecap="round" stroke-width="8" opacity=".35">
    <path d="M136 210v70M136 310v110M136 450v50M176 180v95M176 305v65M176 400v85" />
    <path d="M848 190v85M848 305v70M848 405v80M888 220v60M888 310v105M888 445v45" />
  </g>

  <!-- Full-bleed Neutral Dark Desk -->
  <rect x="0" y="652" width="1024" height="372" fill="#0d0d0f" opacity=".85" />
  <rect x="0" y="646" width="1024" height="8" fill="url(#t-desk)" />

  <!-- Neutral Cyber Terminal -->
  <rect x="222" y="168" width="580" height="424" rx="42" fill="#202024" />
  <rect x="224" y="170" width="576" height="420" rx="40" fill="none" stroke="#71717a" stroke-opacity=".5" stroke-width="4" />
  <circle cx="264" cy="191" r="7" fill="#71717a" opacity=".7" />
  <circle cx="288" cy="191" r="7" fill="#a1a1aa" opacity=".8" />
  <circle cx="312" cy="191" r="7" fill="#ffffff" opacity=".9" />
  <path d="M348 191h120" stroke="#71717a" stroke-opacity=".5" stroke-width="8" stroke-linecap="round" />
  <rect x="248" y="212" width="528" height="354" rx="22" fill="url(#t-screen)" />
  <rect x="248" y="212" width="528" height="354" rx="22" fill="url(#t-screen-glow)" />

  <!-- Commands & prompt -->
  <path d="M280 246L302 262L280 278" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <g stroke-linecap="round" stroke-width="20">
    <path d="M326 262h92" stroke="#ffffff" />
    <path d="M440 262h164" stroke="#d4d4d8" />
    <path d="M334 310h76" stroke="#a1a1aa" />
    <path d="M432 310h196" stroke="#e4e4e7" stroke-opacity=".85" />
    <path d="M334 358h132" stroke="#d4d4d8" />
    <path d="M488 358h108" stroke="#a1a1aa" />
    <path d="M618 358h68" stroke="#71717a" stroke-opacity=".8" />
    <path d="M374 406h142" stroke="#a1a1aa" />
    <path d="M538 406h84" stroke="#d4d4d8" stroke-opacity=".8" />
    <path d="M334 454h88" stroke="#71717a" />
    <path d="M298 502h64" stroke="#ffffff" />
  </g>
  <rect x="382" y="488" width="18" height="28" rx="4" fill="#ffffff" />
  <path d="M732 234c2.6 17.6 10 25 27.6 27.6-17.6 2.6-25 10-27.6 27.6-2.6-17.6-10-25-27.6-27.6 17.6-2.6 25-10 27.6-27.6z" fill="#ffffff" opacity=".95" />

  <!-- The hooded hacker silhouette -->
  <use href="#t-torso-shape" fill="url(#t-torso)" />
  <g clip-path="url(#t-torso-clip)">
    <use href="#t-torso-shape" fill="none" stroke="url(#t-edge)" stroke-width="20" filter="url(#t-soft)" />
    <use href="#t-torso-shape" fill="none" stroke="url(#t-edge)" stroke-width="6.5" opacity=".9" />
    <path d="M372 634L256 748M652 634L768 748" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="6" stroke-linecap="round" />
    <ellipse cx="512" cy="684" rx="156" ry="46" fill="#09090b" opacity=".85" filter="url(#t-soft)" />
  </g>
  <use href="#t-hood-shape" fill="url(#t-hood)" />
  <g clip-path="url(#t-hood-clip)">
    <use href="#t-hood-shape" fill="none" stroke="url(#t-edge)" stroke-width="22" filter="url(#t-soft)" />
    <use href="#t-hood-shape" fill="none" stroke="url(#t-edge)" stroke-width="7" />
    <path d="M512 336V690" stroke="#0a0a0c" stroke-opacity=".7" stroke-width="7" />
    <path d="M448 402C430 486 420 572 406 654M576 402C594 486 604 572 618 654" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="6" stroke-linecap="round" />
    <path d="M364 646C426 708 598 708 660 646" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="7" />
  </g>
</svg>
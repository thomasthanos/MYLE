<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MYLE Passwords iOS Icon: TINTED Edition (iOS 18 Adaptive Monochromatic) -->
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c20" />
      <stop offset=".5" stop-color="#121215" />
      <stop offset="1" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="t-spill" cx=".5" cy=".38" r=".6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12" />
      <stop offset="1" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="t-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35" />
      <stop offset=".5" stop-color="#52525b" stop-opacity=".2" />
      <stop offset="1" stop-color="#27272a" stop-opacity=".3" />
    </linearGradient>
    <linearGradient id="t-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181b" />
      <stop offset="1" stop-color="#0f0f11" />
    </linearGradient>
    <radialGradient id="t-glow" cx=".5" cy=".95" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15" />
      <stop offset="1" stop-color="#0f0f11" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="t-hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272a" />
      <stop offset=".6" stop-color="#18181b" />
      <stop offset="1" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="t-torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272a" />
      <stop offset=".6" stop-color="#141416" />
      <stop offset="1" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="t-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".4" stop-color="#e4e4e7" stop-opacity=".8" />
      <stop offset=".8" stop-color="#71717a" stop-opacity=".3" />
      <stop offset="1" stop-color="#09090b" stop-opacity="0" />
    </linearGradient>
    <filter id="t-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <clipPath id="t-tile">
      <rect x="64" y="64" width="896" height="896" rx="220" />
    </clipPath>
    <path id="t-hood-shape" d="M512 330C470 344 420 384 400 456C386 508 380 584 364 646C426 708 598 708 660 646C644 584 638 508 624 456C604 384 554 344 512 330Z" />
    <path id="t-torso-shape" d="M432 610C336 626 258 666 224 724C194 776 186 866 184 1000H840C838 866 830 776 800 724C766 666 688 626 592 610Z" />
    <clipPath id="t-hood-clip"><use href="#t-hood-shape" /></clipPath>
    <clipPath id="t-torso-clip"><use href="#t-torso-shape" /></clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#t-bg)" />
  <g clip-path="url(#t-tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#t-spill)" />

    <!-- Ambient data columns -->
    <g stroke="#a1a1aa" stroke-linecap="round" stroke-width="7" opacity=".18">
      <path d="M136 210v70M136 310v110M176 180v95M176 305v65M848 190v85M848 305v70M888 220v60M888 310v105" />
    </g>

    <!-- Terminal Frame -->
    <rect x="222" y="168" width="580" height="424" rx="42" fill="#18181b" />
    <rect x="224" y="170" width="576" height="420" rx="40" fill="none" stroke="#71717a" stroke-opacity=".35" stroke-width="3" />
    <circle cx="264" cy="191" r="7" fill="#71717a" opacity=".5" />
    <circle cx="288" cy="191" r="7" fill="#a1a1aa" opacity=".6" />
    <circle cx="312" cy="191" r="7" fill="#e4e4e7" opacity=".8" />
    <path d="M348 191h120" stroke="#71717a" stroke-opacity=".3" stroke-width="8" stroke-linecap="round" />
    <rect x="248" y="212" width="528" height="354" rx="22" fill="url(#t-screen)" />
    <rect x="248" y="212" width="528" height="354" rx="22" fill="url(#t-glow)" />

    <!-- Terminal text -->
    <path d="M280 246L302 262L280 278" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <g stroke-linecap="round" stroke-width="20">
      <path d="M326 262h92" stroke="#ffffff" />
      <path d="M440 262h164" stroke="#d4d4d8" />
      <path d="M334 310h76" stroke="#a1a1aa" />
      <path d="M432 310h196" stroke="#e4e4e7" stroke-opacity=".85" />
      <path d="M334 358h132" stroke="#d4d4d8" />
      <path d="M488 358h108" stroke="#a1a1aa" />
      <path d="M618 358h68" stroke="#71717a" stroke-opacity=".7" />
      <path d="M374 406h142" stroke="#d4d4d8" />
      <path d="M538 406h84" stroke="#a1a1aa" stroke-opacity=".8" />
      <path d="M334 454h88" stroke="#71717a" />
      <path d="M298 502h64" stroke="#ffffff" />
    </g>
    <rect x="382" y="488" width="18" height="28" rx="4" fill="#ffffff" />
    <path d="M732 234c2.6 17.6 10 25 27.6 27.6-17.6 2.6-25 10-27.6 27.6-2.6-17.6-10-25-27.6-27.6 17.6-2.6 25-10 27.6-27.6z" fill="#ffffff" opacity=".85" />

    <!-- Hooded silhouette -->
    <use href="#t-torso-shape" fill="url(#t-torso)" />
    <g clip-path="url(#t-torso-clip)">
      <use href="#t-torso-shape" fill="none" stroke="url(#t-edge)" stroke-width="16" filter="url(#t-soft)" />
      <use href="#t-torso-shape" fill="none" stroke="url(#t-edge)" stroke-width="5" opacity=".9" />
    </g>
    <use href="#t-hood-shape" fill="url(#t-hood)" />
    <g clip-path="url(#t-hood-clip)">
      <use href="#t-hood-shape" fill="none" stroke="url(#t-edge)" stroke-width="18" filter="url(#t-soft)" />
      <use href="#t-hood-shape" fill="none" stroke="url(#t-edge)" stroke-width="5.5" />
      <path d="M512 336V690" stroke="#000000" stroke-opacity=".7" stroke-width="7" />
    </g>
  </g>
  <rect x="70" y="70" width="884" height="884" rx="214" fill="none" stroke="url(#t-rim)" stroke-width="10" />
</svg>

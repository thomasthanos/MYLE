<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".45" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#e2e8f0" />
    </linearGradient>
    <radialGradient id="l-spill" cx=".5" cy=".38" r=".65">
      <stop offset="0" stop-color="#0284c7" stop-opacity=".12" />
      <stop offset=".45" stop-color="#6366f1" stop-opacity=".06" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="l-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="l-screen-glow" cx=".5" cy=".95" r=".85">
      <stop offset="0" stop-color="#0284c7" stop-opacity=".45" />
      <stop offset=".5" stop-color="#6366f1" stop-opacity=".2" />
      <stop offset="1" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="l-desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7" stop-opacity="0" />
      <stop offset=".5" stop-color="#0284c7" stop-opacity=".75" />
      <stop offset="1" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="l-hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b" />
      <stop offset=".55" stop-color="#0f172a" />
      <stop offset="1" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="l-torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182234" />
      <stop offset=".5" stop-color="#0c121e" />
      <stop offset="1" stop-color="#04060b" />
    </linearGradient>
    <linearGradient id="l-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset=".3" stop-color="#34d399" stop-opacity=".9" />
      <stop offset=".68" stop-color="#818cf8" stop-opacity=".5" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <filter id="l-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <path id="l-hood-shape" d="M512 330C470 344 420 384 400 456C386 508 380 584 364 646C426 708 598 708 660 646C644 584 638 508 624 456C604 384 554 344 512 330Z" />
    <path id="l-torso-shape" d="M432 610C336 626 258 666 224 724C194 776 186 866 184 1024H840C838 866 830 776 800 724C766 666 688 626 592 610Z" />
    <clipPath id="l-hood-clip"><use href="#l-hood-shape" /></clipPath>
    <clipPath id="l-torso-clip"><use href="#l-torso-shape" /></clipPath>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1024" height="1024" fill="url(#l-bg)" />
  <rect width="1024" height="1024" fill="url(#l-spill)" />

  <!-- Ambient cyber data columns -->
  <g stroke="#94a3b8" stroke-linecap="round" stroke-width="8" opacity=".35">
    <path d="M136 210v70M136 310v110M136 450v50M176 180v95M176 305v65M176 400v85" />
    <path d="M848 190v85M848 305v70M848 405v80M888 220v60M888 310v105M888 445v45" />
  </g>

  <!-- Full-bleed Sleek Titanium Desk -->
  <rect x="0" y="652" width="1024" height="372" fill="#cbd5e1" opacity=".6" />
  <rect x="0" y="646" width="1024" height="8" fill="url(#l-desk)" />

  <!-- High-Contrast Sleek Cyber Terminal -->
  <rect x="222" y="168" width="580" height="424" rx="42" fill="#0f172a" />
  <rect x="224" y="170" width="576" height="420" rx="40" fill="none" stroke="#38bdf8" stroke-opacity=".35" stroke-width="4" />
  <circle cx="264" cy="191" r="7" fill="#fb7185" opacity=".95" />
  <circle cx="288" cy="191" r="7" fill="#fbbf24" opacity=".95" />
  <circle cx="312" cy="191" r="7" fill="#34d399" opacity=".95" />
  <path d="M348 191h120" stroke="#64748b" stroke-opacity=".6" stroke-width="8" stroke-linecap="round" />
  <rect x="248" y="212" width="528" height="354" rx="22" fill="url(#l-screen)" />
  <rect x="248" y="212" width="528" height="354" rx="22" fill="url(#l-screen-glow)" />

  <!-- Root > prompt, terminal commands, cursor and cyber sparkle -->
  <path d="M280 246L302 262L280 278" fill="none" stroke="#34d399" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <g stroke-linecap="round" stroke-width="20">
    <path d="M326 262h92" stroke="#34d399" />
    <path d="M440 262h164" stroke="#38bdf8" />
    <path d="M334 310h76" stroke="#c084fc" />
    <path d="M432 310h196" stroke="#ffffff" stroke-opacity=".85" />
    <path d="M334 358h132" stroke="#38bdf8" />
    <path d="M488 358h108" stroke="#fbbf24" />
    <path d="M618 358h68" stroke="#34d399" stroke-opacity=".7" />
    <path d="M374 406h142" stroke="#818cf8" />
    <path d="M538 406h84" stroke="#38bdf8" stroke-opacity=".8" />
    <path d="M334 454h88" stroke="#c084fc" />
    <path d="M298 502h64" stroke="#34d399" />
  </g>
  <rect x="382" y="488" width="18" height="28" rx="4" fill="#34d399" />
  <path d="M732 234c2.6 17.6 10 25 27.6 27.6-17.6 2.6-25 10-27.6 27.6-2.6-17.6-10-25-27.6-27.6 17.6-2.6 25-10 27.6-27.6z" fill="#38bdf8" opacity=".95" />

  <!-- The hooded hacker silhouette -->
  <use href="#l-torso-shape" fill="url(#l-torso)" />
  <g clip-path="url(#l-torso-clip)">
    <use href="#l-torso-shape" fill="none" stroke="url(#l-edge)" stroke-width="20" filter="url(#l-soft)" />
    <use href="#l-torso-shape" fill="none" stroke="url(#l-edge)" stroke-width="6.5" opacity=".9" />
    <path d="M372 634L256 748M652 634L768 748" fill="none" stroke="#38bdf8" stroke-opacity=".25" stroke-width="6" stroke-linecap="round" />
    <ellipse cx="512" cy="684" rx="156" ry="46" fill="#04060b" opacity=".85" filter="url(#l-soft)" />
  </g>
  <use href="#l-hood-shape" fill="url(#l-hood)" />
  <g clip-path="url(#l-hood-clip)">
    <use href="#l-hood-shape" fill="none" stroke="url(#l-edge)" stroke-width="22" filter="url(#l-soft)" />
    <use href="#l-hood-shape" fill="none" stroke="url(#l-edge)" stroke-width="7" />
    <path d="M512 336V690" stroke="#04060b" stroke-opacity=".7" stroke-width="7" />
    <path d="M448 402C430 486 420 572 406 654M576 402C594 486 604 572 618 654" fill="none" stroke="#38bdf8" stroke-opacity=".25" stroke-width="6" stroke-linecap="round" />
    <path d="M364 646C426 708 598 708 660 646" fill="none" stroke="#38bdf8" stroke-opacity=".45" stroke-width="7" />
  </g>
</svg>